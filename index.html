<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday Bơ!</title>
   <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5, #ffdee9);
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #ff4757;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            z-index: 10;
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        
        /* --- KHU VỰC THIẾT KẾ BÁNH KEM, NẾN, TRÁI BƠ & DÂU TÂY --- */
        .cake-container {
            position: relative;
            width: 200px;
            height: 180px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .cake-container:hover {
            transform: scale(1.1) rotate(2deg);
        }
        /* Khay đỡ bánh màu vàng */
        .plate {
            width: 220px;
            height: 12px;
            background: #f1c40f;
            border-radius: 10px;
            position: absolute;
            bottom: 0;
        }
        /* Thân bánh kem dâu hồng cam */
        .cake-body {
            width: 170px;
            height: 90px;
            background: #f3a683;
            border-radius: 14px 14px 0 0;
            position: absolute;
            bottom: 10px;
            box-shadow: inset 0 12px 0 #f7d794; /* Lớp kem trang trí ở giữa bánh */
        }
        
        /* VẼ TRÁI BƠ BẰNG CSS 🥑 */
        .avocado {
            position: absolute;
            bottom: 24px;
            left: 28px;
            width: 42px;
            height: 54px;
            background: linear-gradient(145deg, #d8f99f 0%, #7bed9f 48%, #55c878 100%);
            border: 4px solid #218c54;
            border-radius: 58% 42% 56% 44% / 46% 45% 55% 54%;
            transform: rotate(-13deg);
            box-shadow: inset 5px 5px 0 rgba(255,255,255,.38), 3px 4px 0 rgba(33,140,84,.2);
            z-index: 12;
        }
        .avocado::before {
            content: '';
            position: absolute;
            top: 7px;
            left: 9px;
            width: 10px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,.55);
            transform: rotate(25deg);
        }
        .avocado-pit {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 35% 30%, #d99b5f, #9b572d 70%);
            border-radius: 50%;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), 1px 2px 2px rgba(83,42,20,.25);
        }
        /* VẼ QUẢ DÂU TÂY BẰNG CSS 🍓 */
        .strawberry {
            position: absolute;
            bottom: 22px;
            right: 27px;
            width: 42px;
            height: 50px;
            background: linear-gradient(155deg, #ff6b81 0%, #e8415b 65%, #b92745 100%);
            border: 3px solid #b92745;
            border-radius: 52% 48% 48% 52% / 38% 38% 62% 62%;
            transform: rotate(12deg);
            box-shadow: inset 5px 4px 0 rgba(255,255,255,.25), 3px 4px 0 rgba(185,39,69,.2);
            z-index: 12;
        }
        .strawberry::before {
            content: '••••••';
            position: absolute;
            top: 13px;
            left: 7px;
            width: 28px;
            color: #ffeaa7;
            font-size: 10px;
            letter-spacing: 5px;
            line-height: 12px;
            transform: rotate(-8deg);
            text-shadow: 0 10px #ffeaa7, 3px 20px #ffeaa7;
        }
        .strawberry-leaf {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 15px;
            background: #2ed573;
            clip-path: polygon(50% 60%, 0 0, 28% 70%, 17% 100%, 50% 76%, 83% 100%, 72% 70%, 100% 0);
            filter: drop-shadow(1px 2px 0 rgba(33,140,84,.3));
        }        
        /* Thân nến */
        .candle {
            width: 10px;
            height: 45px;
            position: absolute;
            bottom: 100px;
            border-radius: 3px 3px 0 0;
            background: linear-gradient(to right, #ff7878, #ffb8b8);
            z-index: 11;
        }
        /* Ngọn lửa nến cháy lắc lư */
        .flame {
            width: 16px;
            height: 26px;
            position: absolute;
            bottom: 145px;
            animation: flicker 0.1s ease-in-out infinite alternate;
            background: radial-gradient(circle at bottom, #fff700 20%, #ff9f43 60%, #ff3838 100%);
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.8);
            transform-origin: bottom center;
            z-index: 11;
        }
        @keyframes flicker {
            0% { transform: scaleX(0.9) rotate(-2deg); opacity: 0.8; }
            100% { transform: scaleX(1.1) rotate(3deg); opacity: 1; box-shadow: 0 0 25px rgba(255, 159, 67, 1); }
        }
        
        /* Bong bóng tương tác game */
        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 20px;
            padding: 10px 15px;
            color: #d63031; 
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: floatUp linear forwards;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.1s;
			pointer-events: auto !important;
			user-select: text !important;
			-webkit-user-select: text !important;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(-125vh) translateX(50px); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Hạt pháo hoa sinh ra khi chém trúng */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: explode 0.6s ease-out forwards;
        }
        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 7;
            font-size: 18px;
            line-height: 1;
            transform: translate(-50%, -50%);
            animation: heartBurst 0.95s cubic-bezier(.17,.67,.35,1.25) forwards;
            will-change: transform, opacity;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }
        @keyframes heartBurst {
            0% { transform: translate(-50%, -50%) scale(.35) rotate(0deg); opacity: 0; }
            12% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(1.15) rotate(var(--rotate)); opacity: 0; }
        }
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, .85);
        }
        .popup-content {
            position: relative;
            width: min(90vw, 640px);
            aspect-ratio: 16 / 9;
        }
        .popup-content iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px;
        }
        .close-btn {
            position: absolute;
            top: -42px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }        .gift-toast {
            position: fixed;
            top: 22px;
            left: 50%;
            width: min(88vw, 360px);
            padding: 18px 42px 18px 18px;
            box-sizing: border-box;
            color: #7b2436;
            background: rgba(255, 255, 255, .96);
            border: 2px solid #ff9eb1;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(185, 39, 69, .25);
            text-align: left;
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -24px) scale(.94);
            transition: opacity .25s ease, transform .25s ease, visibility .25s;
            z-index: 10000;
        }
        .gift-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0) scale(1);
        }
        .gift-toast-icon {
            float: left;
            margin: 0 10px 4px 0;
            font-size: 2rem;
        }
        .gift-toast-title {
            display: block;
            margin: 2px 0 5px;
            color: #e8415b;
            font-size: 1.05rem;
        }
        .gift-toast-message {
            margin: 0;
            font-size: .92rem;
            line-height: 1.35;
        }
        .gift-toast-progress {
            display: block;
            margin-top: 8px;
            color: #a85b6b;
            font-size: .78rem;
        }
        .gift-toast-close {
            position: absolute;
            top: 8px;
            right: 12px;
            padding: 4px;
            color: #e8415b;
            border: 0;
            background: transparent;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
        }    </style>
</head>
<body>

    <h1>Happy Birthday Bơ! 🎂</h1>
    <div class="cake-container" id="cakeBtn">
        <div class="flame"></div>
        <div class="candle"></div>
        
        <div class="cake-body">
            <!-- Vẽ trái Bơ nhỏ xinh bên trái -->
            <div class="avocado">
                <div class="avocado-pit"></div>
            </div>
            <!-- Vẽ quả Dâu Tây chín đỏ bên phải -->
            <div class="strawberry">
                <div class="strawberry-leaf"></div>
            </div>
        </div>
        
        <div class="plate"></div>
    </div>

    <div class="popup" id="videoPopup" role="dialog" aria-modal="true" aria-label="Video quà tặng">
        <div class="popup-content">
            <button class="close-btn" id="closeVideoBtn" type="button" aria-label="Đóng video">&times;</button>
            <iframe id="ytPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
    <div class="gift-toast" id="giftToast" role="status" aria-live="polite">
        <button class="gift-toast-close" id="giftToastClose" type="button" aria-label="Đóng thông báo">&times;</button>
        <span class="gift-toast-icon" id="giftToastIcon">🎁</span>
        <strong class="gift-toast-title" id="giftToastTitle">Chúc mừng!</strong>
        <p class="gift-toast-message" id="giftToastMessage"></p>
        <small class="gift-toast-progress" id="giftToastProgress"></small>
    </div>
    <script>
        const wishes = [
            "Happy Birthday Bo 🥑🎈",
            "Wishing Bo a super fun new age! 🥳",
            "Sister-in-law 🍓, Dad, and Mom love Bo! 🥳",
            "Stay adorable forever, Bo! 💖\n(Mãi đáng yêu nha Bơ)",
            "Wishing Bo a radiant and beautiful year ahead! 🥰\n(Bơ xinh đẹp rạng ngời)",
            "Study hard and do your best! 🥰\n(Học hành chăm chỉ)",
            "Dad and Mom love Dau 🍓 and Bo 🥑!",
            "Happy Birthday, Bo! 🎂"
        ];

        const giftConfig = [
            {
                icon: '🎁',
                title: 'You found a gift! 🎁',
                message: 'Congratulations! You tapped the secret Wish. 🎉'
            },
            {
                icon: '🎀',
                title: 'A second gift has appeared! 🎀',
                message: 'Awesome! Keep choosing another Wish. ✨'
            },
            {
                icon: '💝',
                title: 'A sweet surprise! 💝',
                message: 'You have unlocked an extra special gift! 💖'
            }
        ];
        let availableGiftIndexes = giftConfig.map((gift, index) => index);
        const collectedGiftIndexes = new Set();
        let giftMisses = 0;
        let giftToastTimer = null;

        function chooseHiddenGift() {
            if (availableGiftIndexes.length === 0) return null;
            giftMisses++;
            const guaranteedAfter = Math.max(6, 13 - availableGiftIndexes.length);
            if (Math.random() >= 0.18 && giftMisses < guaranteedAfter) return null;
            giftMisses = 0;
            const randomPosition = Math.floor(Math.random() * availableGiftIndexes.length);
            return availableGiftIndexes.splice(randomPosition, 1)[0];
        }

        function showGiftCongratulations(giftIndex) {
            const gift = giftConfig[giftIndex];
            if (!gift || collectedGiftIndexes.has(giftIndex)) return;
            collectedGiftIndexes.add(giftIndex);

            const giftToast = document.getElementById('giftToast');
            document.getElementById('giftToastIcon').textContent = gift.icon;
            document.getElementById('giftToastTitle').textContent = gift.title;
            document.getElementById('giftToastMessage').textContent = gift.message;
            document.getElementById('giftToastProgress').textContent = 'Found ' + collectedGiftIndexes.size + '/' + giftConfig.length + ' gifts 🎁';
            giftToast.classList.add('show');

            // clearTimeout(giftToastTimer);
            // giftToastTimer = setTimeout(() => giftToast.classList.remove('show'), 5000);
        }
        // Khởi tạo Audio an toàn cho Safari
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playPopSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                // Lệnh resume bắt buộc để mở khóa âm thanh trên iOS Safari
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'triangle'; 
                oscillator.frequency.setValueAtTime(160, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Safari chặn âm thanh cho đến khi có tương tác vật lý:", e);
            }
        }

        // Hàm tạo hiệu ứng nổ pháo hoa
        function createFireworks(x, y) {
            const colors = ['#ff4757', '#ff7f50', '#ffb8b8', '#ff3838', '#fff200', '#05c46b', '#00d2d3', '#ef5777'];
            const burstCount = 2 + Math.floor(Math.random() * 2);
            for (let burst = 0; burst < burstCount; burst++) {
                const burstX = x + (Math.random() - 0.5) * 48;
                const burstY = y + (Math.random() - 0.5) * 48;
                const particleCount = 24 + Math.floor(Math.random() * 12);

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = burstX + 'px';
                    particle.style.top = burstY + 'px';

                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * 80 + 40;
                    const mx = Math.cos(angle) * velocity + 'px';
                    const my = Math.sin(angle) * velocity + 'px';

                    particle.style.setProperty('--mx', mx);
                    particle.style.setProperty('--my', my);

                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 700);
                }
            }
        }

        function createHeartBurst(x, y) {
            const heartColors = ['#ff4757', '#ff6b81', '#ef5777', '#ff9ff3', '#feca57', '#ffffff'];
            const heartCount = 12 + Math.floor(Math.random() * 9);

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = Math.random() < 0.18 ? '💖' : '♥';
                heart.style.left = x + (Math.random() - 0.5) * 20 + 'px';
                heart.style.top = y + (Math.random() - 0.5) * 20 + 'px';
                heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
                heart.style.fontSize = (14 + Math.random() * 16) + 'px';
                heart.style.setProperty('--mx', ((Math.random() - 0.5) * 180) + 'px');
                heart.style.setProperty('--my', (-35 - Math.random() * 145) + 'px');
                heart.style.setProperty('--rotate', ((Math.random() - 0.5) * 90) + 'deg');
                heart.style.animationDelay = (Math.random() * 120) + 'ms';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1150);
            }
        }

        // Xử lý hành động chém bong bóng (Pop)
        function popBubble(bubble) {
            if (bubble.classList.contains('popped')) return;
            bubble.classList.add('popped');
            
            const rect = bubble.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Chạy âm thanh và pháo hoa độc lập để không gây đứng hình code trên iOS
            playPopSound(); 
            createHeartBurst(centerX, centerY);
            createFireworks(centerX, centerY); 
            if (bubble.dataset.giftIndex !== undefined) {
                showGiftCongratulations(Number(bubble.dataset.giftIndex));
            }
            bubble.remove();
        }

        // Tạo bong bóng bay liên tục
        function interactWithBubble(event, bubble) {
            if (event.type === 'pointerdown' && event.cancelable) {
                event.preventDefault();
            }
            popBubble(bubble);
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = wishes[Math.floor(Math.random() * wishes.length)];
            const hiddenGiftIndex = chooseHiddenGift();
            if (hiddenGiftIndex !== null) bubble.dataset.giftIndex = hiddenGiftIndex;
            
            bubble.style.left = Math.random() * 85 + 'vw';
            const size = Math.random() * 0.4 + 0.9;
            bubble.style.transform = `scale(${size})`;
            
            const colors = ['rgba(255,255,255,0.9)', 'rgba(255,234,167,0.9)', 'rgba(255,204,204,0.9)', 'rgba(224,255,255,0.9)'];
            bubble.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            const duration = Math.random() * 3 + 5;
            bubble.style.animationDuration = duration + 's';
            
            // TƯƠNG TÁC MÁY TÍNH 🖥️
            bubble.addEventListener('pointerdown', (event) => interactWithBubble(event, bubble), { passive: false });
            bubble.addEventListener('click', (event) => interactWithBubble(event, bubble));
            bubble.addEventListener('mouseenter', (e) => {
                if (e.buttons === 1 || e.buttons === 3) popBubble(bubble);
            });

            // TƯƠNG TÁC ĐIỆN THOẠI 📱 (Hỗ trợ tốt nhất cho Safari iOS)
            
            document.body.appendChild(bubble);
            setTimeout(() => {
                if (bubble.parentNode) {
                    if (bubble.dataset.giftIndex !== undefined) availableGiftIndexes.push(Number(bubble.dataset.giftIndex));
                    bubble.remove();
                }
            }, duration * 1000);
        }
        
        // Kích hoạt vòng lặp tạo bong bóng ổn định
        setInterval(createBubble, 500);

        // Xử lý Popup Video độc lập
        const popup = document.getElementById('videoPopup');
        const player = document.getElementById('ytPlayer');
        const cakeBtn = document.getElementById('cakeBtn');
        const closeBtn = document.getElementById('closeVideoBtn');

        function openVideo() {
            popup.style.display = 'flex';
            if (!player.src.includes('&autoplay=1')) {
                player.src += '&autoplay=1';
            }
        }

        function closeVideo() {
            popup.style.display = 'none';
            player.src = player.src.replace('&autoplay=1', '');
        }

        cakeBtn.addEventListener('click', openVideo);
        closeBtn.addEventListener('click', closeVideo);
        popup.addEventListener('click', (event) => {
            if (event.target === popup) closeVideo();
        });
        document.getElementById('giftToastClose').addEventListener('click', () => {
            document.getElementById('giftToast').classList.remove('show');
            clearTimeout(giftToastTimer);
        });
    </script>
</body>
</html>
