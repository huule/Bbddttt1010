<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday Bơ!</title>
   <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5, #ffdee9);
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #ff4757;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            z-index: 10;
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        
        /* --- KHU VỰC THIẾT KẾ BÁNH KEM, NẾN, TRÁI BƠ & DÂU TÂY --- */
        .cake-container {
            position: relative;
            width: 200px;
            height: 180px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .cake-container:hover {
            transform: scale(1.1) rotate(2deg);
        }
        /* Khay đỡ bánh màu vàng */
        .plate {
            width: 220px;
            height: 12px;
            background: #f1c40f;
            border-radius: 10px;
            position: absolute;
            bottom: 0;
        }
        /* Thân bánh kem dâu hồng cam */
        .cake-body {
            width: 170px;
            height: 90px;
            background: #f3a683;
            border-radius: 14px 14px 0 0;
            position: absolute;
            bottom: 10px;
            box-shadow: inset 0 12px 0 #f7d794; /* Lớp kem trang trí ở giữa bánh */
        }
        
        /* VẼ TRÁI BƠ BẰNG CSS 🥑 */
        .avocado {
            position: absolute;
            bottom: 25px;
            left: 35px;
            width: 32px;
            height: 45px;
            background: #7bed9f; /* Thịt bơ xanh nhạt */
            border: 4px solid #2ed573; /* Vỏ bơ xanh đậm */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; /* Tạo dáng hình giọt nước của quả bơ */
            z-index: 12;
        }
        .avocado-pit {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #b33939; /* Hạt bơ màu nâu */
            border-radius: 50%;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* VẼ QUẢ DÂU TÂY BẰNG CSS 🍓 */
        .strawberry {
            position: absolute;
            bottom: 25px;
            right: 35px;
            width: 30px;
            height: 38px;
            background: #ff4757; /* Thân dâu màu đỏ */
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; /* Dáng quả dâu nhọn phần đuôi */
            z-index: 12;
        }
        /* Cuống lá xanh của quả dâu tây */
        .strawberry-leaf {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 10px solid #2ed573;
        }
        
        /* Thân nến */
        .candle {
            width: 10px;
            height: 45px;
            position: absolute;
            bottom: 100px;
            border-radius: 3px 3px 0 0;
            background: linear-gradient(to right, #ff7878, #ffb8b8);
            z-index: 11;
        }
        /* Ngọn lửa nến cháy lắc lư */
        .flame {
            width: 16px;
            height: 26px;
            position: absolute;
            bottom: 145px;
            animation: flicker 0.1s ease-in-out infinite alternate;
            background: radial-gradient(circle at bottom, #fff700 20%, #ff9f43 60%, #ff3838 100%);
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.8);
            transform-origin: bottom center;
            z-index: 11;
        }
        @keyframes flicker {
            0% { transform: scaleX(0.9) rotate(-2deg); opacity: 0.8; }
            100% { transform: scaleX(1.1) rotate(3deg); opacity: 1; box-shadow: 0 0 25px rgba(255, 159, 67, 1); }
        }
        
        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
            z-index: 10;
            transition: 0.3s;
        }
        .btn:hover {
            background: #ff6b81;
            transform: translateY(-3px);
        }
        /* Bong bóng tương tác game */
        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 20px;
            padding: 10px 15px;
            color: #d63031; 
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: floatUp linear forwards;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.1s;
			pointer-events: auto !important;
			user-select: text !important;
			-webkit-user-select: text !important;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(-125vh) translateX(50px); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Hạt pháo hoa sinh ra khi chém trúng */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(0); opacity: 0; }
        }
        /* Popup Video */
        .popup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            position: relative;
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16/9;
        }
        .popup-content iframe {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Happy Birthday Bơ! 🎂</h1>
    <div class="cake-container" id="cakeBtn">
        <div class="flame"></div>
        <div class="candle"></div>
        
        <div class="cake-body">
            <!-- Vẽ trái Bơ nhỏ xinh bên trái -->
            <div class="avocado">
                <div class="avocado-pit"></div>
            </div>
            <!-- Vẽ quả Dâu Tây chín đỏ bên phải -->
            <div class="strawberry">
                <div class="strawberry-leaf"></div>
            </div>
        </div>
        
        <div class="plate"></div>
    </div>
    <button class="btn" id="openVideoBtn">🎬 Xem Video Quà Tặng</button>

    <div class="popup" id="videoPopup">
        <div class="popup-content">
            <button class="close-btn" id="closeVideoBtn">&times;</button>
            <iframe id="ytPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const wishes = [
            "Happy Birthday Bơ 🥑🎈", "Bơ tuổi mới siêu vui nha 🥳", "Chị Dâu 🍓, Ba, Mẹ iu Bơ 🥳", 
            "Mãi đáng yêu nha Bơ 💖", "Bơ xinh đẹp rạng ngời 🥰", 
            "Happy Birthday! 🎉", "Bơ ơi sinh nhật vui vẻ! 🎂"
        ];

        // Khởi tạo Audio an toàn cho Safari
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playPopSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                // Lệnh resume bắt buộc để mở khóa âm thanh trên iOS Safari
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'triangle'; 
                oscillator.frequency.setValueAtTime(160, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Safari chặn âm thanh cho đến khi có tương tác vật lý:", e);
            }
        }

        // Hàm tạo hiệu ứng nổ pháo hoa
        function createFireworks(x, y) {
            const colors = ['#ff4757', '#ff7f50', '#ffb8b8', '#ff3838', '#fff200', '#05c46b', '#00d2d3', '#ef5777'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 80 + 40; 
                const mx = Math.cos(angle) * velocity + 'px';
                const my = Math.sin(angle) * velocity + 'px';

                particle.style.setProperty('--mx', mx);
                particle.style.setProperty('--my', my);

                document.body.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 600);
            }
        }

        // Xử lý hành động chém bong bóng (Pop)
        function popBubble(bubble) {
            if (bubble.classList.contains('popped')) return;
            bubble.classList.add('popped');
            
            const rect = bubble.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Chạy âm thanh và pháo hoa độc lập để không gây đứng hình code trên iOS
            playPopSound(); 
            createFireworks(centerX, centerY); 
            bubble.remove();
        }

        // Tạo bong bóng bay liên tục
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = wishes[Math.floor(Math.random() * wishes.length)];
            
            bubble.style.left = Math.random() * 85 + 'vw';
            const size = Math.random() * 0.4 + 0.9;
            bubble.style.transform = `scale(${size})`;
            
            const colors = ['rgba(255,255,255,0.9)', 'rgba(255,234,167,0.9)', 'rgba(255,204,204,0.9)', 'rgba(224,255,255,0.9)'];
            bubble.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            const duration = Math.random() * 3 + 5;
            bubble.style.animationDuration = duration + 's';
            
            // TƯƠNG TÁC MÁY TÍNH 🖥️
            bubble.addEventListener('mousedown', () => popBubble(bubble));
            bubble.addEventListener('mouseenter', (e) => {
                if (e.buttons === 1 || e.buttons === 3) popBubble(bubble);
            });

            // TƯƠNG TÁC ĐIỆN THOẠI 📱 (Hỗ trợ tốt nhất cho Safari iOS)
          bubble.addEventListener('click', () => popBubble(bubble));
            
            document.body.appendChild(bubble);
            setTimeout(() => { if(bubble.parentNode) bubble.remove(); }, duration * 1000);
        }
        
        // Kích hoạt vòng lặp tạo bong bóng ổn định
        setInterval(createBubble, 500);

        // Xử lý Popup Video độc lập
        const popup = document.getElementById('videoPopup');
        const player = document.getElementById('ytPlayer');
        const openBtn = document.getElementById('openVideoBtn');
        const cakeBtn = document.getElementById('cakeBtn');
        const closeBtn = document.getElementById('closeVideoBtn');

        function openVideo() {
            popup.style.display = 'flex';
            if(!player.src.includes('&autoplay=1')) {
                player.src += "&autoplay=1";
            }
        }

        function closeVideo() {
            popup.style.display = 'none';
            player.src = player.src.replace("&autoplay=1", "");
        }

        openBtn.addEventListener('click', openVideo);
        cakeBtn.addEventListener('click', openVideo);
        closeBtn.addEventListener('click', closeVideo);
        popup.addEventListener('click', (e) => { if(e.target === popup) closeVideo(); });
    </script>
</body>
</html>
